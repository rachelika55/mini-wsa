services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mini_wsa
      POSTGRES_USER: mini_wsa
      POSTGRES_PASSWORD: mini_wsa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_wsa -d mini_wsa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
