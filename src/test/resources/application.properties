spring.datasource.url=jdbc:h2:mem:mini_wsa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
# Disable rate limiting by default so multi-request tests are not throttled; the
# dedicated rate-limit test re-enables it with a low threshold via @SpringBootTest properties.
miniwsa.ratelimit.enabled=false
