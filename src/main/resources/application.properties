spring.application.name=mini-wsa
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mini_wsa}
spring.datasource.username=${DB_USERNAME:mini_wsa}
spring.datasource.password=${DB_PASSWORD:mini_wsa}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
